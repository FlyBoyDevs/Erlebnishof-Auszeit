worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    sendfile on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/ld+json image/svg+xml;

    map $uri $site_cache_control {
        default "no-cache, max-age=0, must-revalidate";
        ~^/img/opt/ "public, max-age=31536000, immutable";
        ~^/content/current\.json$ "no-store";
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        error_page 404 /404.html;

        add_header Cache-Control $site_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data: https://flyboydevs.goatcounter.com; media-src 'self'; script-src 'self' https://gc.zgo.at; connect-src 'self' https://flyboydevs.goatcounter.com; style-src 'self'; font-src 'self'; manifest-src 'self'; frame-src 'none'" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        location / {
            limit_except GET HEAD {
                deny all;
            }
            try_files $uri $uri/ =404;
        }

        location /img/ {
            autoindex off;
            try_files $uri =404;
        }

        location = /404.html {
            internal;
        }

        location ~ /\. {
            deny all;
        }
    }
}
